<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品详情 · VoiceShop++</title>
  <style>
    :root {
      --bg: #12151c;
      --panel: #1b2130;
      --text: #e8edf7;
      --muted: #9aa6bd;
      --accent: #3d8bfd;
      --ok: #3ecf8e;
      --line: #2a3348;
      --warn: #f0c35a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1000px 500px at 10% -10%, #243153 0%, transparent 55%),
        radial-gradient(800px 400px at 100% 0%, #1a3a36 0%, transparent 50%),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    a.back {
      color: #8cbcff;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .panel {
      margin-top: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
    .hero {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 640px) {
      .hero { grid-template-columns: 1fr; }
    }
    .thumb {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #151b28;
      object-fit: contain;
      display: block;
    }
    .thumb.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      line-height: 1.35;
      font-weight: 650;
    }
    .price {
      color: var(--ok);
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .summary {
      line-height: 1.55;
      font-size: 0.95rem;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      font-weight: 650;
    }
    .rows {
      display: grid;
      gap: 8px;
    }
    .row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px;
      font-size: 0.92rem;
      padding: 8px 0;
      border-bottom: 1px solid rgba(42, 51, 72, 0.8);
    }
    .row dt { color: var(--muted); }
    .row dd { margin: 0; word-break: break-word; }
    ul {
      margin: 0;
      padding-left: 1.1em;
      line-height: 1.55;
      font-size: 0.92rem;
    }
    .err { color: #ff8e8e; }
    .hint { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <a class="back" id="backLink" href="/voice-test">← 返回</a>
    <section class="panel" id="root">
      <p class="hint">加载中…</p>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const pid = (params.get("id") || "").trim();
    const from = (params.get("from") || "voice-test").trim();
    const back = document.getElementById("backLink");
    if (from === "chat-test") back.href = "/chat-test";
    else if (from === "voice-test") back.href = "/voice-test";
    else back.href = "/" + from.replace(/^\//, "");

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function listField(val) {
      if (Array.isArray(val)) return val.map(String).filter(Boolean);
      if (typeof val === "string" && val.trim()) {
        try {
          const parsed = JSON.parse(val);
          if (Array.isArray(parsed)) return parsed.map(String).filter(Boolean);
        } catch (_) {}
        return val.split(/[|;,\n]/).map((x) => x.trim()).filter(Boolean);
      }
      return [];
    }

    function meaningful(s) {
      s = String(s || "").trim();
      if (!s) return false;
      const low = s.toLowerCase();
      return !low.startsWith("not specified") && !low.startsWith("no aggregated");
    }

    async function load() {
      const root = document.getElementById("root");
      if (!pid) {
        root.innerHTML = `<p class="err">缺少商品 id</p>`;
        return;
      }
      try {
        const res = await fetch(`/api/v1/products/${encodeURIComponent(pid)}`);
        const p = await res.json();
        if (!res.ok) throw new Error(p.detail || p.error || ("HTTP " + res.status));
        document.title = `${p.name || pid} · VoiceShop++`;

        const img = (p.image_url || "").trim();
        const reasons = listField(p.reasons);
        const tradeOffs = listField(p.trade_offs);
        const rows = [];
        const push = (label, value) => {
          if (!meaningful(value)) return;
          rows.push(`<div class="row"><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd></div>`);
        };
        push("ASIN / ID", p.id);
        push("Store", p.store);
        push("Platform", p.platform);
        push("Display", p.display);
        push("Performance", p.performance);
        push("Battery", p.battery);
        if (p.weight_kg) push("Weight", `${p.weight_kg} kg`);
        push("Rating", p.rating ? `${p.rating}/5` + (p.rating_number ? ` · ${p.rating_number} reviews` : "") : "");
        push("Review insight", p.review_sentiment);
        push("Weakness", p.weakness);

        root.innerHTML = `
          <div class="hero">
            ${img
              ? `<img class="thumb" src="${escapeHtml(img)}" alt="" referrerpolicy="no-referrer" />`
              : `<div class="thumb placeholder">No image</div>`}
            <div>
              <h1>${escapeHtml(p.name || "Product")}</h1>
              <div class="price">$${p.price ?? "—"}</div>
              <div class="meta">${escapeHtml(p.id || "")}${p.platform ? " · " + escapeHtml(p.platform) : ""}</div>
              <p class="summary">${escapeHtml(p.summary || "No summary available.")}</p>
            </div>
          </div>
          ${reasons.length ? `
            <div class="panel" style="margin:16px 0 0;padding:0;border:0;background:transparent;">
              <h2>Why it may match</h2>
              <ul>${reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul>
            </div>` : ""}
          <div style="margin-top:16px;">
            <h2>Product details</h2>
            <div class="rows">${rows.join("") || `<p class="hint">暂无更多结构化字段</p>`}</div>
          </div>
          ${tradeOffs.length ? `
            <div style="margin-top:16px;">
              <h2>Trade-offs</h2>
              <ul>${tradeOffs.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul>
            </div>` : ""}
          <p class="hint">数据来自本地 Catalog DB（Amazon Reviews 2023）。</p>
        `;
      } catch (err) {
        root.innerHTML = `<p class="err">加载失败：${escapeHtml(err.message || err)}</p>`;
      }
    }

    load();
  </script>
</body>
</html>
