<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoiceShop++ 文本对话测试</title>
  <style>
    :root {
      --bg: #12151c;
      --panel: #1b2130;
      --text: #e8edf7;
      --muted: #9aa6bd;
      --accent: #3d8bfd;
      --ok: #3ecf8e;
      --bad: #ff6b6b;
      --line: #2a3348;
      --user: #243553;
      --bot: #1e2a24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1000px 500px at 10% -10%, #243153 0%, transparent 55%),
        radial-gradient(800px 400px at 100% 0%, #1a3a36 0%, transparent 50%),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    h1 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 1.45rem;
      font-weight: 650;
    }
    .sub {
      grid-column: 1 / -1;
      color: var(--muted);
      margin: 0 0 4px;
      line-height: 1.5;
      font-size: 0.92rem;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      min-height: 0;
    }
    .chat {
      display: flex;
      flex-direction: column;
      height: min(72vh, 720px);
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #151b28;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #666;
    }
    .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(62, 207, 142, 0.15); }
    .dot.busy { background: #f0c040; }
    .dot.err { background: var(--bad); }
    #log {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 2px 8px;
    }
    .msg {
      max-width: 92%;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border: 1px solid #33507a;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid #2f4a3a;
    }
    .msg.sys {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      border: 0;
      padding: 2px 0;
    }
    .composer {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    textarea {
      flex: 1;
      resize: vertical;
      min-height: 64px;
      max-height: 160px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #151b28;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: white;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: #5a6478; }
    .side h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      font-weight: 650;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: min(42vh, 420px);
      overflow: auto;
    }
    a.card {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #151b28;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    a.card:hover {
      border-color: #4a6ea8;
      background: #1a2438;
    }
    .card .thumb {
      width: 84px;
      height: 84px;
      border-radius: 10px;
      object-fit: contain;
      background: #0f141f;
      border: 1px solid var(--line);
    }
    .card .thumb-fallback {
      width: 84px;
      height: 84px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f141f;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
      padding: 6px;
    }
    .card .name {
      font-weight: 650;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .price { color: var(--ok); font-weight: 650; }
    .card .meta-line { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }
    .card .reasons {
      margin-top: 6px;
      color: #c5d0e6;
      font-size: 0.82rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    pre.debug {
      margin: 0;
      max-height: min(28vh, 280px);
      overflow: auto;
      font-size: 0.75rem;
      line-height: 1.4;
      color: #b7c3da;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hint { color: var(--muted); font-size: 0.82rem; margin-top: 8px; }
    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .quick button {
      background: #243049;
      font-size: 0.8rem;
      padding: 6px 10px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main>
    <h1>VoiceShop++ 文本对话测试</h1>
    <p class="sub">
      走完整 multi-agent：POST /text → Planner → Recall → Verify → Recommend。
      语音页见 <a href="/voice-test" style="color:#7eb6ff">/voice-test</a>。
    </p>

    <section class="panel chat">
      <div class="meta">
        <span class="pill"><span id="statusDot" class="dot"></span><span id="statusText">未连接</span></span>
        <span class="pill">session: <code id="sid">-</code></span>
        <button class="secondary" id="btnNew" type="button">新会话</button>
      </div>
      <div id="log"></div>
      <div class="quick">
        <button type="button" data-q="我想要白色透气跑鞋，预算150左右">跑鞋示例</button>
        <button type="button" data-q="第二个便宜一点">追问第二个</button>
        <button type="button" data-q="有没有更轻便一点的">refine</button>
        <button type="button" data-q="对比前两个哪个更适合跑步">对比</button>
      </div>
      <div class="composer">
        <textarea id="input" placeholder="输入购物需求，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="btnSend" type="button">发送</button>
      </div>
      <p class="hint">发送后会触发 Worker；页面轮询推荐结果（最长约 90s）。</p>
    </section>

    <aside class="side" style="display:flex; flex-direction:column; gap:16px;">
      <section class="panel">
        <h2>推荐结果</h2>
        <div id="summary" class="hint" style="margin-bottom:8px;">暂无</div>
        <div id="cards" class="cards"></div>
      </section>
      <section class="panel">
        <h2>会话 / Preference</h2>
        <pre id="debug" class="debug">{}</pre>
      </section>
    </aside>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = {
      sessionId: null,
      busy: false,
      pollTimer: null,
    };

    function setStatus(kind, text) {
      const dot = $("statusDot");
      dot.className = "dot" + (kind ? " " + kind : "");
      $("statusText").textContent = text;
    }

    function addMsg(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      $("log").appendChild(el);
      $("log").scrollTop = $("log").scrollHeight;
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || data.error || ("HTTP " + res.status));
      }
      return data;
    }

    async function newSession() {
      stopPoll();
      const data = await api("/api/v1/session", {
        method: "POST",
        body: JSON.stringify({}),
      });
      state.sessionId = data.session_id;
      $("sid").textContent = state.sessionId;
      $("log").innerHTML = "";
      $("cards").innerHTML = "";
      $("summary").textContent = "暂无";
      $("debug").textContent = JSON.stringify(data, null, 2);
      setStatus("on", "会话就绪");
      addMsg("sys", "新会话已创建。直接输入需求即可触发 Planner/Worker。");
    }

    const productCache = new Map();

    async function enrichRanked(ranked) {
      const out = [];
      for (const item of ranked.slice(0, 8)) {
        const id = String(item.id || "").trim();
        let full = item;
        if (id && !item.image_url) {
          if (productCache.has(id)) {
            full = { ...productCache.get(id), ...item };
          } else {
            try {
              const data = await api(`/api/v1/products/${encodeURIComponent(id)}`);
              productCache.set(id, data);
              full = { ...data, ...item };
            } catch (_) {}
          }
        }
        out.push(full);
      }
      return out;
    }

    async function renderBundle(bundle) {
      if (!bundle) {
        $("summary").textContent = "暂无";
        $("cards").innerHTML = "";
        return;
      }
      $("summary").textContent = bundle.summary || "(no summary)";
      const ranked = await enrichRanked(bundle.ranked || []);
      $("cards").innerHTML = ranked.map((r, i) => {
        const id = r.id || "";
        const img = (r.image_url || "").trim();
        const href = id
          ? `/product?id=${encodeURIComponent(id)}&from=chat-test`
          : "#";
        const thumb = img
          ? `<img class="thumb" src="${escapeHtml(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" />`
          : `<div class="thumb-fallback">No image</div>`;
        return `
        <a class="card" href="${escapeHtml(href)}" target="_blank" rel="noopener">
          ${thumb}
          <div>
            <div class="name">#${i + 1} ${escapeHtml(r.name || r.id)}</div>
            <div class="price">$${r.price ?? "?"} · score ${r.score ?? "-"}</div>
            <div class="meta-line">${escapeHtml(id)}${r.rating ? ` · ${r.rating}/5` : ""}</div>
            <div class="reasons">${escapeHtml((r.reasons || []).join(" · "))}</div>
          </div>
        </a>`;
      }).join("");
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function stopPoll() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }

    function pollRecommendations(prevPlanId) {
      stopPoll();
      const started = Date.now();
      let lastStatus = "";
      let sawNonReady = false;
      setStatus("busy", "Worker 运行中…");
      state.pollTimer = setInterval(async () => {
        if (!state.sessionId) return;
        if (Date.now() - started > 90000) {
          stopPoll();
          setStatus("err", "等待推荐超时");
          addMsg("sys", "超时：未在 90s 内拿到推荐。可查看后端日志。");
          state.busy = false;
          $("btnSend").disabled = false;
          return;
        }
        try {
          const rec = await api(`/api/v1/session/${state.sessionId}/recommendations`);
          const snap = await api(`/api/v1/session/${state.sessionId}`);
          $("debug").textContent = JSON.stringify({
            status: rec.status,
            message: rec.message,
            preference: snap.preference,
            memory_summary: snap.memory_summary,
            worker: snap.worker,
          }, null, 2);

          const st = rec.status || "";
          if (st && st !== "ready") sawNonReady = true;
          if (st && st !== lastStatus) {
            lastStatus = st;
            if (rec.message) addMsg("sys", `[worker] ${st}: ${rec.message}`);
          }

          const bundle = rec.bundle;
          const planId = (bundle && bundle.plan_id) || "";
          const ranked = (bundle && bundle.ranked) || [];
          const isNewPlan = planId && planId !== prevPlanId;
          const readyFresh =
            st === "ready" &&
            bundle &&
            isNewPlan &&
            (sawNonReady || Date.now() - started > 1200);

          if (readyFresh) {
            stopPoll();
            await renderBundle(bundle);
            const lines = [];
            if (bundle.summary) lines.push(bundle.summary);
            ranked.slice(0, 3).forEach((r, i) => {
              lines.push(`${i + 1}. ${r.name} ($${r.price})`);
            });
            addMsg("bot", lines.join("\n") || "已更新推荐。");
            setStatus("on", "推荐就绪");
            state.busy = false;
            $("btnSend").disabled = false;
          }
        } catch (err) {
          console.warn(err);
        }
      }, 800);
    }

    async function sendText(text) {
      text = (text || "").trim();
      if (!text || state.busy) return;
      if (!state.sessionId) await newSession();
      state.busy = true;
      $("btnSend").disabled = true;
      addMsg("user", text);
      $("input").value = "";
      setStatus("busy", "分析意图 / 规划中…");
      let prevPlanId = "";
      try {
        const before = await api(`/api/v1/session/${state.sessionId}/recommendations`);
        prevPlanId = (before.bundle && before.bundle.plan_id) || "";
      } catch (_) {}
      try {
        const data = await api(`/api/v1/session/${state.sessionId}/text`, {
          method: "POST",
          body: JSON.stringify({ text }),
        });
        $("debug").textContent = JSON.stringify({
          preference: data.preference,
          analysis: data.analysis,
        }, null, 2);
        const pref = data.preference || {};
        addMsg(
          "sys",
          `intent 已更新 · keywords=${(pref.search_keywords || []).join(", ") || "-"} · provider=${(data.analysis || {}).provider || "-"}`
        );
        pollRecommendations(prevPlanId);
      } catch (err) {
        addMsg("sys", "发送失败: " + err.message);
        setStatus("err", "发送失败");
        state.busy = false;
        $("btnSend").disabled = false;
      }
    }

    $("btnNew").onclick = () => newSession().catch((e) => {
      setStatus("err", "建会话失败");
      addMsg("sys", String(e.message || e));
    });
    $("btnSend").onclick = () => sendText($("input").value);
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendText($("input").value);
      }
    });
    document.querySelectorAll(".quick button").forEach((btn) => {
      btn.onclick = () => sendText(btn.getAttribute("data-q"));
    });

    newSession().catch((e) => {
      setStatus("err", "后端未启动?");
      addMsg("sys", "无法创建会话，请先启动 backend/server.py\n" + (e.message || e));
    });
  </script>
</body>
</html>
